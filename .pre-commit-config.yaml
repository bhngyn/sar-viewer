# Pre-commit hooks per CLAUDE.md §3.
# Install with: uv run pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinned to match `uv sync`'s resolved version so pre-commit and CI
    # agree on formatting (0.6.9 → 0.15.13 changed assert-message wrapping).
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown]
        exclude: ^(uv\.lock|.*\.min\.(js|css))$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [--strict]
        files: ^(shared/|services/api/src/)
        additional_dependencies:
          - pydantic>=2.7
          - fastapi>=0.115
          - types-requests
          - structlog>=24.1
          - sqlalchemy>=2.0
          - celery>=5.4

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
