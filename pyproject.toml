[project]
name = "sar-viewer"
version = "0.1.0"
description = "Dockerized SAR/OSINT investigation tool for human rights researchers"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = "==3.11.*"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "structlog>=24.1",
    "shapely>=2.0",
    "pyproj>=3.6",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "sqlalchemy>=2.0.49",
    "pystac-client>=0.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
    "vcrpy>=8.1.1",
    "pytest-recording>=0.13.4",
    "respx>=0.23.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["shared", "services/api/src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["shapely.*", "pyproj.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aiosqlite.*", "vcr.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
