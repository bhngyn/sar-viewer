[project]
name = "sar-viewer"
version = "0.1.0"
description = "Dockerized SAR/OSINT investigation tool for human rights researchers"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = "==3.11.*"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "structlog>=24.1",
    "shapely>=2.0",
    "pyproj>=3.6",
    # Phase 1 — Ingest
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "sqlalchemy[asyncio]>=2.0.49",
    "pystac-client>=0.9.0",
    # Phase 1 — Jobs & Storage
    "celery[redis]>=5.4",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
    "vcrpy>=8.1.1",
    "pytest-recording>=0.13.4",
    "respx>=0.23.1",
    "celery[pytest]>=5.4",
    # processor + analyzer service test deps
    "rasterio>=1.3",
    "rio-cogeo>=5.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.4",
    # fusion service test deps
    "pillow>=10.0",
    "matplotlib>=3.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "shared",
    "services/api/src",
    "services/worker/src",
    "services/processor/src",
    "services/analyzer/src",
    "services/fusion/src",
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["shapely.*", "pyproj.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "aiosqlite.*",
    "vcr.*",
    "respx.*",
    "celery.*",
    "kombu.*",
    "redis.*",
    "alembic.*",
    "sqlalchemy.*",
    "rasterio.*",
    "rio_cogeo.*",
    "scipy.*",
    "sklearn.*",
    "matplotlib.*",
    "PIL.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery's @app.task decorator has no type stubs so decorated functions become
# untyped.  We also have deferred imports for optional service packages
# (services/ingest, services/processor) that are not installed in every env.
# Suppress all errors in this file; the logic is tested end-to-end via the
# integration test suite.
module = ["services.worker.src.tasks"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
