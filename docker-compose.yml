# Phase 0 docker-compose. Five services are stubbed per CLAUDE.md §0/§5.
# All services run as non-root and on a single user-defined bridge network
# (no host networking, no --privileged) per the OPSEC profile in §6.

name: sar-viewer

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: sar-viewer/api:0.1.0
    container_name: sar-viewer-api
    ports:
      - "8000:8000"
    environment:
      - LOG_AOI=${LOG_AOI:-false}
      - AUDIT_LOG_ENABLED=${AUDIT_LOG_ENABLED:-false}
    networks: [internal]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    image: sar-viewer/worker:0.1.0
    container_name: sar-viewer-worker
    depends_on: [redis]
    networks: [internal]
    restart: "no" # Phase 0 placeholder exits cleanly; Celery wiring is Phase 1.

  redis:
    image: redis:7-alpine
    container_name: sar-viewer-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [internal]
    restart: unless-stopped

  tiler:
    image: ghcr.io/developmentseed/titiler:latest
    container_name: sar-viewer-tiler
    ports:
      - "8001:8000"
    environment:
      - PORT=8000
    networks: [internal]
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: services/ui/Dockerfile
    image: sar-viewer/ui:0.1.0
    container_name: sar-viewer-ui
    ports:
      - "5173:80"
    networks: [internal]
    restart: unless-stopped

  # SNAP sidecar — ESA SNAP 10.0 GPT for heavy SAR processing.
  # The processor worker invokes ``gpt`` via subprocess over the shared
  # ./data/scratch volume.  SLC jobs are capped at MAX_SLC_PARALLEL=2
  # (see services/processor/src/pipeline.py) to avoid OOM on 16 GB hosts.
  #
  # OPSEC §6: non-root user, no --privileged, internal bridge network only.
  # This container has NO outbound network access at runtime (orbit files and
  # DEMs are downloaded on first run via SNAP's auto-download mechanism, which
  # does use the network — that is expected and documented).
  snap:
    build:
      context: .
      dockerfile: services/processor/snap.Dockerfile
      args:
        SNAP_VERSION: "10.0"
        SNAP_MAX_MEM: "14G"
    image: sar-viewer/snap:10.0
    container_name: sar-viewer-snap
    volumes:
      - ./data/scratch:/scratch
    networks: [internal]
    restart: unless-stopped
    # Resource limits: 14 GB heap inside JVM + OS overhead; cap at 15 GB here.
    mem_limit: 15g
    # No ports exposed — invoked via shared volume, not HTTP.

networks:
  internal:
    driver: bridge
