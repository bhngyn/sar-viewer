[project]
name = "sar-viewer-analyzer"
version = "0.1.0"
description = "Anomaly detection (baseline + statistical + omnibus) for sar-viewer."
requires-python = "==3.11.*"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.4",
    "rasterio>=1.3",
    "rio-cogeo>=5.0",
    "pydantic>=2.7",
    "structlog>=24.1",
]

[tool.uv]
package = false
