[project]
name = "ingest"
version = "0.1.0"
description = "CDSE OAuth2, STAC search, Sentinel Hub preview, OData/S3 download"
requires-python = "==3.11.*"
dependencies = [
    "httpx>=0.27",
    "pystac-client>=0.8",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.1",
    "pydantic>=2.7",
    "shapely>=2.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
test = [
    "vcrpy>=6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
